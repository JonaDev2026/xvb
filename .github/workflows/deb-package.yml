name: Build Debian package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (for example v4.4.4)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deb-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: source

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          SOURCE_VERSION="$(sed -n 's/^VERSIONE = "\(.*\)"/\1/p' source/xvb.py | head -n 1)"
          if [[ "$SOURCE_VERSION" != "$VERSION" ]]; then
            echo "::error::Release tag version ($VERSION) does not match xvb.py ($SOURCE_VERSION)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          cd source
          sh crea_deb.sh "${{ steps.version.outputs.version }}"

      - name: Validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="source/xvb_${{ steps.version.outputs.version }}_all.deb"
          if [[ ! -s "$PACKAGE" ]]; then
            echo "::error::Debian package was not produced"
            exit 1
          fi
          dpkg-deb --info "$PACKAGE"

      - name: Attach Debian package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="source/xvb_${{ steps.version.outputs.version }}_all.deb"
          gh release upload "$RELEASE_TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --clobber
