name: Build Fedora RPM package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(sed -n 's/^VERSIONE = "\(.*\)"/\1/p' source/xvb.py | head -n 1)"
          [[ "$SOURCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            VERSION="${RELEASE_TAG#v}"
            [[ "$VERSION" == "$SOURCE_VERSION" ]] || { echo "::error::Release tag and source versions differ"; exit 1; }
          else
            VERSION="$SOURCE_VERSION"
            RELEASE_TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build RPM in Fedora
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "$GITHUB_WORKSPACE/source:/src" -v "$GITHUB_WORKSPACE/out:/out" fedora:latest bash -euc '
            dnf -y install rpm-build tar gzip
            TOP=/tmp/rpmbuild
            mkdir -p "$TOP"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
            VERSION="$(sed -n "s/^VERSIONE = \"\(.*\)\"/\1/p" /src/xvb.py | head -n 1)"
            STAGE="/tmp/xvb-$VERSION"
            mkdir -p "$STAGE"
            cp /src/xvb.py /src/traduzioni.py /src/icon.png "$STAGE/"
            cp /src/packaging/fedora/mpv.py "$STAGE/"
            mkdir -p "$STAGE/usr/share/licenses/xvb"
            cp /src/packaging/fedora/LICENSE.GPL /src/packaging/fedora/LICENSE.LGPL "$STAGE/usr/share/licenses/xvb/"
            cp -a /src/icone /src/fonts "$STAGE/"
            mkdir -p "$STAGE/usr/bin" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/512x512/apps"
            cat > "$STAGE/usr/bin/xvb" << "EOF"
          #!/bin/sh
          exec /usr/bin/python3 /usr/lib/xvb/xvb.py "$@"
          EOF
            chmod 755 "$STAGE/usr/bin/xvb"
            cat > "$STAGE/usr/share/applications/xvb.desktop" << "EOF"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=XVB Player
          Comment=Media player for videos, music, discs and IPTV
          Exec=xvb %F
          Icon=xvb
          Terminal=false
          Categories=AudioVideo;Video;Player;TV;
          StartupNotify=true
          StartupWMClass=Xvb
          EOF
            cp /src/icon.png "$STAGE/usr/share/icons/hicolor/512x512/apps/xvb.png"
            tar -C /tmp -czf "$TOP/SOURCES/xvb-$VERSION.tar.gz" "xvb-$VERSION"
            cat > "$TOP/SPECS/xvb.spec" <<SPEC
          Name:           xvb
          Version:        $VERSION
          Release:        1%{?dist}
          Summary:        Media player for videos, music, discs and IPTV
          License:        MIT AND (GPL-2.0-or-later OR LGPL-2.1-or-later)
          BuildArch:      noarch
          Requires:       python3
          Requires:       python3-tkinter
          Requires:       mpv-libs
          Requires:       python3-pillow
          Requires:       python3-mutagen
          Requires:       librsvg2-tools
          Requires:       fontconfig
          Source0:        xvb-%{version}.tar.gz

          %description
          Media player built on libmpv for local media, discs and IPTV.

          %prep
          %setup -q

          %build

          %install
          mkdir -p %{buildroot}/usr/lib/xvb
          cp xvb.py traduzioni.py %{buildroot}/usr/lib/xvb/
          install -m644 mpv.py %{buildroot}/usr/lib/xvb/mpv.py
          mkdir -p %{buildroot}/usr/share/licenses/xvb
          cp usr/share/licenses/xvb/LICENSE.GPL usr/share/licenses/xvb/LICENSE.LGPL %{buildroot}/usr/share/licenses/xvb/
          cp -a icone fonts %{buildroot}/usr/lib/xvb/
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/512x512/apps
          install -m755 usr/bin/xvb %{buildroot}/usr/bin/xvb
          install -m644 usr/share/applications/xvb.desktop %{buildroot}/usr/share/applications/xvb.desktop
          install -m644 usr/share/icons/hicolor/512x512/apps/xvb.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/xvb.png

          %files
          /usr/lib/xvb
          /usr/share/licenses/xvb
          /usr/bin/xvb
          /usr/share/applications/xvb.desktop
          /usr/share/icons/hicolor/512x512/apps/xvb.png

          %changelog
          * Fri Nov 06 2026 XVB Project - $VERSION-1
          - Initial Fedora package
          SPEC
            rpmbuild -bb --define "_topdir $TOP" "$TOP/SPECS/xvb.spec"
            cp "$TOP"/RPMS/noarch/*.rpm /out/
          '

      - name: Validate RPM
        run: |
          set -euo pipefail
          test -n "$(find out -maxdepth 1 -type f -name '*.rpm' -print -quit)"

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" out/*.rpm --repo "$GITHUB_REPOSITORY" --clobber
